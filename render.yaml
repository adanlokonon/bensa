# Configuration de déploiement Render.com
# Voir https://render.com/docs/yaml-spec

services:
  - type: web
    name: bensa
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_PATH
        value: instance/bensa.db
      - key: TRIAL_DURATION_DAYS
        value: 14
      - key: TRIAL_REMINDER_DAY
        value: 12
      - key: TRIAL_BLOCK_DAY
        value: 15
      - key: SUBSCRIPTION_AMOUNT_FCFA
        value: 3000
      - key: CONTACT_EMAIL
        value: jesukpegosalomon@gmail.com
      - key: PAYMENT_PHONE
        value: "01 64 23 96 51"
      # Ajouter manuellement dans le dashboard Render :
      # CLOUDINARY_CLOUD_NAME
      # CLOUDINARY_API_KEY
      # CLOUDINARY_API_SECRET
